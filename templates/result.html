    .chart-container { width: 50%; margin: auto; }

<!-- JAVASCRIPTS -->
<script>
  // Example data, modify this based on actual results
  var labels = ["Violence", "Non-Violence"];
  var dataValues = {{ probabilities | tojson }};  // Get probability data from backend

  var barCtx = document.getElementById('barChart').getContext('2d');
  new Chart(barCtx, {
      type: 'bar',
      data: {
          labels: labels,
          datasets: [{
              label: 'Prediction Probability',
              data: dataValues,
              backgroundColor: ['red', 'green'],
              borderColor: ['darkred', 'darkgreen'],
              borderWidth: 1
          }]
      },
      options: {
          responsive: true,
          scales: {
              y: { beginAtZero: true, max: 1 }
          }
      }
  });

  var pieCtx = document.getElementById('pieChart').getContext('2d');
  new Chart(pieCtx, {
      type: 'pie',
      data: {
          labels: labels,
          datasets: [{
              data: dataValues,
              backgroundColor: ['red', 'green']
          }]
      }
  });
</script>
